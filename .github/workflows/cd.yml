name: MemoryBot CD

# A merged pull request updates main and triggers this workflow.
# Branch protection requires the "Build and test" CI check before that merge.
on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: memorybot-cd-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set lowercase image name
      id: image
      env:
        REPOSITORY: ${{ github.repository }}
      run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: |
          ${{ steps.image.outputs.name }}:latest
          ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=memorybot-cd
        cache-to: type=gha,mode=max,scope=memorybot-cd
