name: MemoryBot CI

on:
  push:
    branches: ['feature/**']

permissions:
  contents: read

concurrency:
  group: memorybot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax check
        run: python -m compileall -q Backend Chatbot Evaluation Memory RAG Tools Frontend
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Frontend regression tests
        run: |
          node tests/test_memory_details_ui.cjs
          node tests/test_api_config.cjs