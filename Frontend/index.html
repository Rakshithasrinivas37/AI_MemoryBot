<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#202d3b" /><title>MemoryBot — Your story starts here</title><link rel="stylesheet" href="style.css" /></head>
<body class="login-page">
    <main class="login-layout">
        <section class="login-story"><a class="sidebar-logo" href="index.html"><span class="logo-icon" aria-hidden="true">✳</span><span>MemoryBot</span></a><div class="story-content"><h1>Some thoughts<br>deserve to<br><em>stay with you.</em></h1><div class="story-art" aria-hidden="true"><span>✳</span></div></div></section>
        <section class="login-form-section"><div class="login-container"><h2>Welcome <em>back.</em></h2><form onsubmit="event.preventDefault(); login()"><div class="input-group"><label for="username">What should we call you?</label><input type="text" id="username" placeholder="Your username" autocomplete="username" required /></div><div class="input-group"><label for="api_key">Groq API key <span>For your conversations</span></label><input type="password" id="api_key" placeholder="Enter your Groq API key" autocomplete="off" required /></div><div class="input-group"><label for="hf_token">Hugging Face token <span>For your memories</span></label><input type="password" id="hf_token" placeholder="Enter your Hugging Face token" autocomplete="off" required /></div><p id="error-msg" class="error" role="alert"></p><button class="login-btn" id="login-btn" type="submit">Sign in ↗</button></form><p class="login-note"><span aria-hidden="true">✧</span> Returning? Use the same username to reconnect with your memories.</p></div></section>
    </main>
    <script>
        const BASE_URL = "http://127.0.0.1:8000";

        async function login() {
            if (document.getElementById("login-btn").disabled) return;
            const username = document.getElementById("username").value.trim();
            const api_key  = document.getElementById("api_key").value.trim();
            const hf_token = document.getElementById("hf_token").value.trim();
            const errorMsg = document.getElementById("error-msg");
            const loginBtn = document.getElementById("login-btn");

            // ── Validate ───────────────────────────────
            if (!username) {
                showError("Please enter a username");
                return;
            }
            if (!api_key) {
                showError("Please enter your Groq API key");
                return;
            }
            if (!hf_token) {
                showError("Please enter your HF Token");
                return;
            }

            loginBtn.disabled    = true;
            loginBtn.textContent = "Logging in...";
            errorMsg.style.display = "none";

            try {
                const response = await fetch(`${BASE_URL}/login`, {
                    method : "POST",
                    headers: { "Content-Type": "application/json" },
                    body   : JSON.stringify({
                        username: username,
                        groq_api_key: api_key,
                        hf_token: hf_token
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // ✅ Save to sessionStorage
                    sessionStorage.setItem("username", username);
                    sessionStorage.setItem("groq_api_key",  api_key);
                    sessionStorage.setItem("hf_token", hf_token);


                    // ✅ Redirect to chat page
                    window.location.href = `chat.html?username=${encodeURIComponent(username)}`;
                } else {
                    showError(data.detail || data.message || "Login failed");
                }

            } catch (error) {
                showError("Cannot connect to server. Is the backend running?");
            } finally {
                loginBtn.disabled    = false;
                loginBtn.textContent = "Sign in ↗";
            }
        }

        function showError(message) {
            const errorMsg         = document.getElementById("error-msg");
            errorMsg.textContent   = message;
            errorMsg.style.display = "block";
        }


    </script>

</body>
</html>
